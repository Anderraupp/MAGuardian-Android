plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.maguardian.security'
    compileSdk 36

    defaultConfig {
        applicationId "com.maguardian.security"
        minSdk 26
        targetSdk 36
        versionCode 42
        versionName "1.6.4"
        testInstrumentationRunner "com.maguardian.security.data.CatalogTestRunner"
        // A harmless fixture outside the application's intentionally trusted prefix.
        testApplicationId "com.catalogvalidation.fixture"
        buildConfigField "String", "THREAT_CATALOG_URL", '"https://raw.githubusercontent.com/Anderraupp/MAGuardian-Android/main/threat-catalog/catalog.json"'
    }

    buildTypes {
        // Never run mutating catalog tests against the user's installed application.
        catalogValidation {
            initWith debug
            applicationIdSuffix ".catalogvalidation"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            buildConfigField "String", "THREAT_CATALOG_URL", '"https://10.0.2.2:8443/threat-catalog.json"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testBuildType "catalogValidation"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        catalogValidation {
            java.srcDir "build/generated/catalogValidationKeys"
            res.srcDir "build/generated/catalogValidationResources"
            assets.srcDir "build/generated/catalogRotationAssets"
        }
    }
}

// Only the disposable variant has QA roots. Debug/release always compile the
// operator's real immutable trust policy, never the generated QA provider.
def prepareCatalogValidationTls = tasks.register("prepareCatalogValidationTls", Exec) {
    workingDir rootProject.projectDir
    commandLine "node", "tools/catalog-validation-server.mjs", "--prepare"
    doLast {
        def stage = project.findProperty("catalogRotationStage")
        if (stage != null) {
            if (!(stage in ['old', 'transition', 'recovery'])) {
                throw new GradleException("Invalid disposable catalog rotation stage")
            }
            exec {
                workingDir rootProject.projectDir
                commandLine "node", "tools/catalog-rotation-fixtures.mjs", stage
            }
        } else {
            delete file("build/generated/catalogRotationAssets")
        }
    }
}
android.applicationVariants.all { variant ->
    if (variant.buildType.name == "catalogValidation" && project.hasProperty("catalogRotationStage")) {
        def versions = [old: 41, transition: 42, recovery: 43]
        def stage = project.property("catalogRotationStage")
        if (!versions.containsKey(stage)) throw new GradleException("Invalid rotation stage")
        variant.outputs.each { output -> output.versionCodeOverride = versions[stage] }
    }
}
tasks.configureEach {
    if (name == "preCatalogValidationBuild") dependsOn prepareCatalogValidationTls
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    if (name == "compileCatalogValidationKotlin") {
        exclude { it.file.canonicalFile == file("src/main/java/com/maguardian/security/data/ThreatCatalogKeys.kt").canonicalFile }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Para TWA (Trusted Web Activity)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

    // Google Play Billing — assinaturas
    implementation 'com.android.billingclient:billing:9.0.0'

    // Meta (Facebook) SDK — rastreamento de campanhas
    implementation 'com.facebook.android:facebook-android-sdk:17.0.1'

    // TikTok Business SDK — arquivo local (evita problemas de resolução JitPack)
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
