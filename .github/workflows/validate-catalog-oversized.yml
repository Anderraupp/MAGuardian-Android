name: Validate oversized persisted catalog safely
on:
  push:
    branches: [qa/catalog-oversized-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-oversized-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oversized-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_VALIDATION_OUTPUT: ${{ github.workspace }}/generated-artifacts/android-oversized
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public trust and QA command contract without production secrets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run catalog:check-trust
          node --test tools/catalog-oversized-driver.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable acceleration on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Upgrade old QA directly to recovery with an oversized persisted cache
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: DISPOSABLE_ANDROID=true ANDROID_SERIAL=emulator-5554 bash tools/validate-android-catalog.sh --rotation-oversized
      - name: Confirm production sources, pins, permissions and version unchanged
        if: always()
        run: git diff --exit-code -- app/src/main app/build.gradle build.gradle gradle.properties threat-catalog/trusted-keys.json shared/catalog-trust.ts
      - name: Save metadata and results only, never cache content, APKs or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-catalog-oversized-evidence
          path: generated-artifacts/android-oversized/
          retention-days: 7
      - name: Delete ephemeral signing material
        if: always()
        run: rm -rf app/build/catalogRotationSession app/build/catalogValidationFixtures
