name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar apenas os pinos públicos e o bootstrap assinado
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run catalog:check-trust

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Instalar Build Tools e SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: maguardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Mostrar informações do APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "APK gerado com sucesso!"
