name: Validate simultaneous signed catalog installs safely
on:
  push:
    branches: [qa/catalog-concurrent-install]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-concurrent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  concurrent-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_VALIDATION_OUTPUT: ${{ github.workspace }}/generated-artifacts/android-concurrent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check public trust and disposable fixtures
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run catalog:check-trust
          node --test tools/catalog-rotation-fixtures.test.mjs
          node --test tools/catalog-concurrent-driver.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Compete real installers and read the winning catalog in a new process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: DISPOSABLE_ANDROID=true ANDROID_SERIAL=emulator-5554 bash tools/validate-android-catalog.sh --concurrent-install
      - name: Confirm production sources and policy unchanged
        if: always()
        run: git diff --exit-code -- app/src/main app/build.gradle build.gradle gradle.properties threat-catalog/trusted-keys.json shared/catalog-trust.ts
      - name: Save public evidence without APKs or private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-catalog-concurrent-evidence
          path: generated-artifacts/android-concurrent/
          retention-days: 7
      - name: Delete ephemeral signing material
        if: always()
        run: rm -rf app/build/catalogRotationSession app/build/catalogValidationFixtures
